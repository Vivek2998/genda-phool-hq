<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFF6E5">
<title>Shraddha's Genda Phool HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127804;</text></svg>">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}img,svg,canvas{display:block;max-width:100%}button{font-family:inherit}</style>
</head>
<body>
<canvas id="petal-canvas" aria-hidden="true"></canvas>
<div class="bloom" id="bloom" aria-hidden="true"></div>
<div class="blower" id="blower" aria-hidden="true">😮‍💨</div>

<div class="app">

  <svg id="garland" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true"></svg>

  <main class="stage">

    <!-- ================= SCREEN 1 — CAKE ================= -->
    <section class="screen active" id="s-cake">
      <div class="bare">
        <h2 class="card-h">Candle bujhao</h2>

        <button class="cake-hit" id="cake-hit" type="button" aria-label="Cake pe click karke candle bujhao">
          <svg id="cake" viewBox="0 0 320 240" aria-hidden="true">
            <ellipse cx="160" cy="216" rx="118" ry="12" class="c-plate"/>
            <rect x="52" y="150" width="216" height="62" rx="12" class="c-tier"/>
            <path d="M52 158 q18 20 36 0 q18 20 36 0 q18 20 36 0 q18 20 36 0 q18 20 36 0 v-16 h-216 z" class="c-icing"/>
            <rect x="90" y="104" width="140" height="52" rx="11" class="c-tier2"/>
            <path d="M90 110 q17 19 34 0 q17 19 34 0 q17 19 34 0 q17 19 34 0 v-14 h-140 z" class="c-icing"/>
            <g id="cake-flowers"></g>
            <g class="candle" data-i="0">
              <rect x="115" y="66" width="9" height="40" rx="4" class="c-wax"/>
              <rect x="115" y="66" width="9" height="40" rx="4" class="c-wax-stripe"/>
              <g class="flame-g"><ellipse class="flame" cx="119.5" cy="56" rx="7" ry="12"/><ellipse class="flame-in" cx="119.5" cy="58" rx="3" ry="6"/></g>
              <g class="smoke"><circle cx="119.5" cy="52" r="4"/><circle cx="123" cy="42" r="3"/><circle cx="117" cy="33" r="2.4"/></g>
            </g>
            <g class="candle" data-i="1">
              <rect x="155" y="58" width="9" height="48" rx="4" class="c-wax"/>
              <rect x="155" y="58" width="9" height="48" rx="4" class="c-wax-stripe"/>
              <g class="flame-g"><ellipse class="flame" cx="159.5" cy="48" rx="7" ry="12"/><ellipse class="flame-in" cx="159.5" cy="50" rx="3" ry="6"/></g>
              <g class="smoke"><circle cx="159.5" cy="44" r="4"/><circle cx="163" cy="34" r="3"/><circle cx="157" cy="25" r="2.4"/></g>
            </g>
            <g class="candle" data-i="2">
              <rect x="195" y="66" width="9" height="40" rx="4" class="c-wax"/>
              <rect x="195" y="66" width="9" height="40" rx="4" class="c-wax-stripe"/>
              <g class="flame-g"><ellipse class="flame" cx="199.5" cy="56" rx="7" ry="12"/><ellipse class="flame-in" cx="199.5" cy="58" rx="3" ry="6"/></g>
              <g class="smoke"><circle cx="199.5" cy="52" r="4"/><circle cx="203" cy="42" r="3"/><circle cx="197" cy="33" r="2.4"/></g>
            </g>
          </svg>
        </button>
      </div>
    </section>

    <!-- ================= SCREEN 2 — HERO ================= -->
    <section class="screen" id="s-hero">
      <div class="hero">
        <h1 class="mega">
          <span class="l l-1"><i data-txt="Happy"></i></span>
          <span class="l l-2"><i data-txt="Birthday"></i></span>
          <span class="l l-3"><i data-txt="Shraddha"></i></span>
        </h1>

        <p class="hero-sub">Badhai ho buzurg 😜</p>

        <div class="countdown" id="countdown">
          <div class="cd-box"><span class="cd-num" id="cd-d">--</span><span class="cd-lab">din</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-h">--</span><span class="cd-lab">ghante</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-m">--</span><span class="cd-lab">minute</span></div>
          <div class="cd-box"><span class="cd-num" id="cd-s">--</span><span class="cd-lab">second</span></div>
        </div>

        <div class="arena">
          <button class="giftbox" id="giftbox" type="button" aria-label="Gift kholne ke liye dabaye rakho">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="54"/>
              <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="54"/>
            </svg>
            <span class="giftbox-emoji" id="giftbox-emoji">🎁</span>
          </button>
        </div>
        <p class="tip" id="tip">Click 👆</p>
      </div>
    </section>

    <!-- ================= SCREEN 3 — GIFT ================= -->
    <section class="screen" id="s-gift">
      <div class="card gift-card">
        <div class="gift-inner">
          <p class="say-small say-top">Majak kar raha tha baba</p>
          <p class="say-big">Tum Bahut Khubsurat Ho</p>
          <p class="say-small">believe me, sachi 🌼</p>

          <div class="strip" id="gallery"></div>
        </div>

        <svg class="cardbow" viewBox="0 0 120 96" aria-hidden="true">
          <path class="cardbow-tail" d="M60 40 C54 58 44 74 30 88 L48 93 C56 78 60 62 62 48 Z"/>
          <path class="cardbow-tail" d="M60 40 C66 58 76 74 90 88 L72 93 C64 78 60 62 58 48 Z"/>
          <path class="cardbow-loop" d="M58 36 C40 11 8 9 6 30 C4 51 34 50 58 44 Z"/>
          <path class="cardbow-loop" d="M62 36 C80 11 112 9 114 30 C116 51 86 50 62 44 Z"/>
          <ellipse class="cardbow-knot" cx="60" cy="40" rx="11" ry="10"/>
        </svg>

        <div class="giftband giftband-v" aria-hidden="true"></div>
        <div class="giftband giftband-h" aria-hidden="true"></div>
        <div class="bow" aria-hidden="true">🎀</div>
      </div>
    </section>

  </main>
</div>

/* ============================================================
   PALETTE — single warm daylight theme, no dark mode.
   Marigold festival: cream sun-ground, warm cocoa ink.
   ============================================================ */
:root{
  --ground:#FFF6E5;
  --ground-2:#FFE9C4;
  --surface:#FFFDF7;
  --ink:#3B2412;
  --ink-soft:#8A6541;
  --marigold:#F5A623;
  --marigold-deep:#EE6C12;
  --leaf:#4E9A47;
  --sohrai:#D6472F;
  --gulabi:#E7568A;

  --soft:0 14px 34px rgba(160,95,25,.16), 0 3px 8px rgba(160,95,25,.08);
  --lift:0 22px 52px rgba(160,95,25,.22), 0 4px 12px rgba(160,95,25,.10);

  --display:"Arial Black","Arial Bold",Arial,system-ui,sans-serif;
  --script:"Palatia",Georgia,"Noto Serif",serif;
  --body:Georgia,"Noto Serif","Times New Roman",serif;
  --mono:ui-monospace,"DejaVu Sans Mono","Courier New",monospace;
}

/* ============================================================
   SHELL — one screen, never scrolls the page
   ============================================================ */
*{box-sizing:border-box}
html{overflow:hidden}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(130% 70% at 50% -12%, #FFE6A6 0%, rgba(255,230,166,0) 62%),
    radial-gradient(100% 55% at 50% 112%, #FFD7AE 0%, rgba(255,215,174,0) 60%),
    var(--ground);
  background-attachment:fixed;
  font-family:var(--body); font-size:16px; line-height:1.6;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
b{font-weight:700}

#petal-canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}

/* smoke bloom that swallows the screen between stage 1 and 2 */
.bloom{
  position:fixed; left:50%; top:58%; width:150vmax; height:150vmax;
  margin:-75vmax 0 0 -75vmax; z-index:6; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,252,243,.98) 0%, rgba(255,244,224,.92) 32%,
    rgba(255,236,205,.55) 55%, rgba(255,232,198,0) 74%);
}
.bloom.go{animation:bloom 1.9s cubic-bezier(.25,.7,.3,1) forwards}
@keyframes bloom{
  0%{opacity:0; transform:scale(.05)}
  18%{opacity:1}
  55%{opacity:1; transform:scale(1.1)}
  100%{opacity:0; transform:scale(1.7) translateY(-14%)}
}

/* the blow-cursor */
.blower{
  position:fixed; left:0; top:0; z-index:8; pointer-events:none;
  font-size:34px; line-height:1; opacity:0;
  transform:translate(-50%,-50%);
  transition:opacity .18s ease;
  filter:drop-shadow(0 4px 8px rgba(160,95,25,.35));
}
.blower.on{opacity:1; animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{ from{margin-top:-2px} to{margin-top:3px} }
.blower.puff{animation:puff-out .55s ease forwards}
@keyframes puff-out{
  0%{opacity:1}
  40%{transform:translate(-50%,-50%) scale(1.5) rotate(-14deg)}
  100%{transform:translate(-50%,-90%) scale(.7) rotate(10deg); opacity:0}
}

.app{
  position:relative; z-index:1;
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
}
#garland{
  flex:none; display:block; width:100%;
  height:clamp(58px,9vh,104px); overflow:visible;
  transform-origin:50% 0; animation:sway 7s ease-in-out infinite alternate;
}
@keyframes sway{ from{transform:rotate(-.7deg)} to{transform:rotate(.7deg) translateY(3px)} }

.stage{position:relative; flex:1; min-height:0}
.screen{
  position:absolute; inset:0;
  display:flex; padding:8px 16px 18px;
  overflow-y:auto; overflow-x:hidden;
  opacity:0; visibility:hidden; pointer-events:none;
}
.screen > *{margin:auto; width:100%}
.screen.active{opacity:1; visibility:visible; pointer-events:auto}
#s-cake.active,#s-gift.active{animation:screen-in .6s cubic-bezier(.2,.9,.3,1)}
@keyframes screen-in{ from{opacity:0; transform:scale(.92) translateY(22px)} }
.screen.leaving{opacity:1; visibility:visible; animation:screen-out .55s ease forwards}
@keyframes screen-out{ to{opacity:0; transform:scale(.86) translateY(-18px)} }

/* ============================================================
   CARD — borderless, floating on the warm ground
   ============================================================ */
.card,.bare{
  max-width:520px; max-height:100%; text-align:center;
  display:flex; flex-direction:column; min-height:0;
}
.card{
  background:var(--surface); border-radius:30px;
  padding:26px 22px 24px;
  box-shadow:var(--soft);
}
/* the cake screen wears no card — it sits straight on the marigold ground */
.bare{padding:4px 6px}
.card-h{
  font-family:var(--display); text-transform:uppercase;
  font-size:clamp(28px,7.5vw,40px); line-height:.98; letter-spacing:-.015em;
  margin:0; text-wrap:balance; color:var(--ink);
}

/* ============================================================
   CAKE
   ============================================================ */
.cake-hit{
  display:block; width:100%; margin:8px auto 0;
  background:none; border:0; font:inherit; color:inherit;
  border-radius:22px; padding:4px;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:transform .25s ease;
}
.cake-hit:hover{transform:translateY(-5px) scale(1.03)}
.cake-hit:focus-visible{outline:3px dashed var(--gulabi); outline-offset:5px}
.cake-hit.blown{animation:cake-shake .55s ease}
@keyframes cake-shake{ 20%{transform:rotate(-2.5deg)} 60%{transform:rotate(2.5deg)} }
@media (pointer:fine){ .cake-hit{cursor:none} }
@media (pointer:coarse){ .cake-hit{cursor:pointer} }
#cake{width:100%; max-width:330px; height:auto; display:block; margin:0 auto}

.c-plate{fill:#EBCB93}
.c-tier{fill:var(--sohrai)}
.c-tier2{fill:var(--gulabi)}
.c-icing{fill:#FFFBF0}
.c-wax{fill:var(--leaf)}
.c-wax-stripe{fill:none; stroke:#FFFBF0; stroke-width:2.5; stroke-dasharray:5 7}
.flame{fill:var(--marigold-deep)}
.flame-in{fill:#FFD34E}
.flame-g{transform-origin:center bottom; transform-box:fill-box; animation:flicker 1.1s ease-in-out infinite alternate}
.candle[data-i="1"] .flame-g{animation-duration:.85s}
.candle[data-i="2"] .flame-g{animation-duration:1.35s}
.cake-hit:hover .flame-g{animation-duration:.32s}
@keyframes flicker{
  from{transform:scale(1) rotate(-4deg); opacity:.9}
  to{transform:scale(1.13,1.22) rotate(4deg); opacity:1}
}
.smoke{fill:#B9A188; opacity:0; transform-box:fill-box; transform-origin:center bottom}
/* the shorthand here replaces `flicker` outright — a running animation
   would otherwise keep overriding a plain opacity:0 */
.candle.out .flame-g{animation:blow-out .42s cubic-bezier(.35,0,.65,1) forwards}
@keyframes blow-out{
  0%{transform:scale(1) rotate(0deg) translateX(0); opacity:1}
  30%{transform:scale(1.35,.72) rotate(-26deg) translateX(-5px); opacity:.95}
  65%{transform:scale(.55,.34) rotate(-44deg) translateX(-9px); opacity:.55}
  100%{transform:scale(0,.08) rotate(-54deg) translateX(-12px); opacity:0}
}
.candle.out .smoke{animation:puff 1.6s ease-out forwards .2s}
@keyframes puff{
  0%{opacity:.55; transform:translateY(0) scale(.6)}
  100%{opacity:0; transform:translateY(-30px) scale(1.7)}
}

/* ============================================================
   HERO — letters fly in one by one out of the smoke
   ============================================================ */
.hero{text-align:center; max-width:720px}
.mega{
  margin:0; font-family:var(--display); font-weight:900;
  text-transform:uppercase; line-height:.95; letter-spacing:-.02em;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  width:100%;
}
.l{display:block}
.l i{display:block; font-style:normal; white-space:nowrap}
.ch{display:inline-block; will-change:transform}

.l-1{transform:rotate(-2.5deg)} .l-1 i{font-size:clamp(30px,9.4vw,62px); color:var(--leaf)}
.l-2{transform:rotate(1.5deg)}  .l-2 i{font-size:clamp(38px,12.4vw,82px); color:var(--marigold-deep)}
.l-3{transform:rotate(-1deg)}
.l-3 i{
  font-size:clamp(42px,14.6vw,94px); color:var(--marigold);
  -webkit-text-stroke:2px var(--ink); text-shadow:4px 4px 0 var(--sohrai); padding:3px 0;
}

#s-hero.active .ch{animation:ch-in .72s cubic-bezier(.18,1.5,.36,1) backwards}
@keyframes ch-in{
  from{opacity:0; transform:translateY(70px) rotate(-30deg) scale(.35)}
  60%{opacity:1}
}
.l:hover .ch{animation:wave-ch .5s ease-in-out}
@keyframes wave-ch{ 40%{transform:translateY(-9px) rotate(-6deg)} }

.hero-sub{
  max-width:32ch; margin:18px auto 0;
  font-size:22px; color:var(--ink-soft);
}
.countdown{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:18px 0 0}
.cd-box{
  background:var(--surface); border-radius:15px;
  padding:9px 5px 7px; min-width:64px; box-shadow:var(--soft);
}
.cd-num{
  display:block; font-family:var(--display); font-size:24px; line-height:1;
  font-variant-numeric:tabular-nums; color:var(--marigold-deep);
}
.cd-lab{
  display:block; font-family:var(--mono); font-size:8.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-soft); margin-top:4px;
}
.cd-num.pop{animation:pop .35s ease}
@keyframes pop{ 50%{transform:scale(1.3)} }
#s-hero.active .hero-sub{animation:rise .6s ease .95s backwards}
#s-hero.active .countdown{animation:rise .6s ease 1.1s backwards}
#s-hero.active .arena,#s-hero.active .tip{animation:rise .6s ease 1.25s backwards}
#s-hero.active .giftbox{animation:bob-gift 2.2s ease-in-out 2s infinite alternate}
@keyframes bob-gift{ from{transform:translateY(0) rotate(-2deg)} to{transform:translateY(-7px) rotate(2deg)} }
.giftbox.filling,.giftbox.done{animation:none !important}
@keyframes rise{ from{opacity:0; transform:translateY(18px)} }

/* ============================================================
   BUTTONS — borderless, chunky, soft-shadowed
   ============================================================ */
.btn{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;
  font-size:14px; color:var(--ink); border:0;
  background:var(--marigold); border-radius:999px; padding:13px 20px; cursor:pointer;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  box-shadow:0 5px 0 var(--marigold-deep), var(--soft);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 7px 0 var(--marigold-deep), var(--lift)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--marigold-deep), var(--soft)}
.btn:focus-visible{outline:3px dashed var(--gulabi); outline-offset:4px}

.arena{
  position:relative; min-height:clamp(132px,20vh,176px);
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  margin-top:12px;
}
/* hold-to-open gift — one target, no dodging, made for thumbs */
.giftbox{
  position:relative; width:132px; height:132px; padding:0; border:0;
  transition:opacity .2s ease;
  background:none; cursor:pointer; border-radius:50%;
  touch-action:none; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}
.giftbox:focus-visible{outline:3px dashed var(--gulabi); outline-offset:6px}
.giftbox-emoji{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:66px; line-height:1;
  filter:drop-shadow(0 8px 14px rgba(160,95,25,.34));
  transition:transform .18s cubic-bezier(.2,1.4,.4,1);
}
.giftbox:hover .giftbox-emoji{transform:scale(1.06) rotate(-4deg)}
.giftbox.filling{pointer-events:none}
.giftbox.filling .giftbox-emoji{animation:rattle .16s linear infinite}
@keyframes rattle{
  0%{transform:translate(-2px,0) rotate(-5deg) scale(1.08)}
  25%{transform:translate(2px,-2px) rotate(4deg) scale(1.11)}
  50%{transform:translate(-1px,2px) rotate(-3deg) scale(1.09)}
  75%{transform:translate(2px,1px) rotate(5deg) scale(1.12)}
  100%{transform:translate(-2px,0) rotate(-5deg) scale(1.08)}
}
.giftbox.done .giftbox-emoji{animation:gift-pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes gift-pop{
  40%{transform:scale(1.5) rotate(-12deg)}
  100%{transform:scale(.2) rotate(20deg); opacity:0}
}
.ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring-bg{stroke:#F3D9AE}
.ring-fg{
  stroke:var(--marigold-deep);
  stroke-dasharray:339.3; stroke-dashoffset:339.3;
  transition:stroke-dashoffset .25s ease;
}
.giftbox.filling .ring-fg{
  stroke-dashoffset:0;
  transition:stroke-dashoffset 1.15s cubic-bezier(.35,.05,.4,1);
}
.tip{
  font-family:var(--mono); font-size:11px; color:var(--ink-soft);
  margin:12px 0 0; min-height:2.8em; line-height:1.6;
  max-width:30ch; margin-inline:auto;
}
.tip b{color:var(--marigold-deep)}

/* ============================================================
   GIFT CARD
   ============================================================ */
.gift-card{position:relative; overflow:hidden}
/* a bow tied onto the card's top-left corner */
.cardbow{
  position:absolute; top:2px; left:6px; z-index:5;
  width:86px; height:69px; overflow:visible;
  transform:rotate(-13deg); transform-origin:60% 45%;
  filter:drop-shadow(0 5px 10px rgba(160,95,25,.3));
}
.cardbow-loop{fill:var(--gulabi)}
.cardbow-tail{fill:#C33A6E}
.cardbow-knot{fill:#F589B0}
#s-gift.active .cardbow{animation:bow-tie .7s cubic-bezier(.2,1.5,.35,1) .95s backwards}
@keyframes bow-tie{
  0%{opacity:0; transform:rotate(-15deg) scale(.25) translateY(-26px)}
  60%{opacity:1; transform:rotate(-15deg) scale(1.15)}
  100%{opacity:1; transform:rotate(-15deg) scale(1)}
}
.gift-card .gift-inner{padding-top:20px}
.gift-inner{min-height:0; overflow-y:auto; padding:2px}
#s-gift.active .gift-inner{animation:rise .6s ease .5s backwards}

.giftband{position:absolute; background:var(--gulabi); z-index:3; pointer-events:none}
.giftband-v{left:50%; top:0; width:44px; height:100%; margin-left:-22px}
.giftband-h{top:50%; left:0; height:44px; width:100%; margin-top:-22px}
.bow{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-size:52px; z-index:4; pointer-events:none; line-height:1;
}
#s-gift.active .giftband-v{animation:band-v .85s cubic-bezier(.5,0,.75,0) forwards .12s}
#s-gift.active .giftband-h{animation:band-h .85s cubic-bezier(.5,0,.75,0) forwards .12s}
#s-gift.active .bow{animation:bow-pop .7s ease forwards .05s}
@keyframes band-v{ to{transform:translateY(-108%); opacity:0} }
@keyframes band-h{ to{transform:translateX(108%); opacity:0} }
@keyframes bow-pop{
  35%{transform:translate(-50%,-50%) scale(1.35) rotate(-12deg)}
  100%{transform:translate(-50%,-165%) scale(.4) rotate(24deg); opacity:0}
}

.say-small{
  margin:0 auto; max-width:26ch;
  font-size:16px; line-height:1.5; color:var(--ink-soft);
}
.say-top{padding-left:46px}
.say-big{
  margin:7px auto;
  font-family:var(--script); font-weight:700; font-style:italic;
  font-size:clamp(31px,8.8vw,46px); line-height:1.06;
  color:var(--gulabi); text-wrap:balance;
}
#s-gift.active .say-big{animation:say-in .8s cubic-bezier(.2,1.3,.35,1) .8s backwards}
@keyframes say-in{ from{opacity:0; transform:translateY(14px) scale(.94)} }
.strip{
  display:flex; align-items:flex-start; gap:13px;
  overflow-x:auto; overflow-y:hidden;
  padding:18px 2px 10px; scroll-snap-type:x mandatory;
}
.polaroid{
  position:relative;
  flex:0 0 clamp(158px,46vw,196px); scroll-snap-align:center;
  background:#FFFDF7; border-radius:6px;
  padding:8px 8px 0; box-shadow:var(--soft);
  display:flex; flex-direction:column; margin:0;
  transition:transform .25s cubic-bezier(.2,.9,.3,1), box-shadow .25s ease;
}
.polaroid:hover,.polaroid:focus-within{transform:rotate(0deg) scale(1.06) translateY(-4px); box-shadow:var(--lift)}

/* the one she calls her favourite gets a wider frame and a marigold mount */
.polaroid.fav{
  background:linear-gradient(160deg,#FFE9C4 0%,#FFFDF7 55%);
  padding:11px 11px 0;
  box-shadow:0 0 0 2px var(--marigold), var(--soft);
}
.polaroid.fav .polaroid-cap{color:var(--marigold-deep)}
.polaroid.fav::after{
  content:"🌼 Poori Heroine wali photo";
  font-size:6.6px; letter-spacing:.03em; position:absolute; top:-9px; left:50%;
  transform:translateX(-50%) rotate(-2deg);
  background:var(--marigold); color:#3B2412;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 8px; border-radius:999px; white-space:nowrap;
  box-shadow:0 3px 8px rgba(160,95,25,.3);
}
.polaroid-img{
  width:100%; aspect-ratio:4/5; object-fit:cover;
  border-radius:2px; display:block; background:var(--ground-2);
}
.polaroid-empty{
  width:100%; aspect-ratio:4/5; border-radius:2px;
  background:repeating-linear-gradient(45deg,var(--ground-2) 0 9px,#FFF6E5 9px 18px);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); padding:10px; line-height:1.6;
}
.polaroid-cap{
  font-family:var(--mono); font-size:10px; color:var(--ink-soft);
  text-align:center; padding:8px 3px 10px; margin:0; line-height:1.5;
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
  .giftband,.bow,.bloom,.blower{display:none}
}
</style>

<script>
(function(){
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine = window.matchMedia("(pointer:fine)").matches;
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  /* ---------------- marigold builder ---------------- */
  var PETAL = ["#F5A623","#EE6C12","#FFC93C","#E8891A"];
  var NS = "http://www.w3.org/2000/svg";
  function marigold(cx, cy, r, seed){
    var g = document.createElementNS(NS,"g");
    var base = PETAL[seed % PETAL.length], alt = PETAL[(seed+1) % PETAL.length];
    [[r,base,13],[r*0.68,alt,10],[r*0.4,base,7]].forEach(function(ring, ri){
      for(var i=0;i<ring[2];i++){
        var a = (360/ring[2])*i + ri*11 + seed*7;
        var p = document.createElementNS(NS,"ellipse");
        p.setAttribute("cx",cx); p.setAttribute("cy", cy - ring[0]*0.55);
        p.setAttribute("rx", ring[0]*0.34); p.setAttribute("ry", ring[0]*0.5);
        p.setAttribute("fill", ring[1]);
        p.setAttribute("transform","rotate("+a+" "+cx+" "+cy+")");
        g.appendChild(p);
      }
    });
    var c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r*0.26);
    c.setAttribute("fill","#C4480A");
    g.appendChild(c);
    return g;
  }

  /* ---------------- garland ---------------- */
  function safe(fn){ try{ fn(); }catch(err){ /* decoration is optional, interaction is not */ } }

  safe(function(){
    var garland = document.getElementById("garland");
    var W = 1200, sag = 126, y0 = 24;
    var rope = document.createElementNS(NS,"path");
    rope.setAttribute("d","M0 "+y0+" Q600 "+sag+" 1200 "+y0);
    rope.setAttribute("fill","none");
    rope.setAttribute("stroke", cssVar("--leaf"));
    rope.setAttribute("stroke-width","3");
    garland.appendChild(rope);
    for(var i=0;i<=26;i++){
      var t = i/26, mt = 1-t;
      var x = 2*mt*t*(W/2) + t*t*W;
      var y = mt*mt*y0 + 2*mt*t*sag + t*t*y0;
      if(i % 2 === 0){
        var leaf = document.createElementNS(NS,"ellipse");
        leaf.setAttribute("cx",x); leaf.setAttribute("cy",y+13);
        leaf.setAttribute("rx",5); leaf.setAttribute("ry",12);
        leaf.setAttribute("fill", cssVar("--leaf"));
        leaf.setAttribute("transform","rotate("+((i%3-1)*22)+" "+x+" "+(y+13)+")");
        garland.appendChild(leaf);
      }
      garland.appendChild(marigold(x, y+8, (i%3===0)?17:13, i));
    }
  });

  safe(function(){
    var cf = document.getElementById("cake-flowers");
    [[72,150],[248,151],[104,104],[216,104],[160,150]].forEach(function(p,i){
      cf.appendChild(marigold(p[0], p[1], 11, i+2));
    });
  });

  /* ---------------- split hero into characters ---------------- */
  safe(function(){
    var n = 0;
    document.querySelectorAll(".mega i").forEach(function(el, li){
      var txt = el.getAttribute("data-txt");
      for(var i=0;i<txt.length;i++){
        var s = document.createElement("span");
        s.className = "ch"; s.textContent = txt[i];
        s.style.animationDelay = (0.30 + n*0.042 + li*0.05).toFixed(3) + "s";
        el.appendChild(s);
        n++;
      }
    });
  });

  /* ---------------- fit hero lines to the screen ---------------- */
  var heroEl = document.querySelector(".hero");
  var megaLines = Array.prototype.slice.call(document.querySelectorAll(".mega i"));
  var rng = document.createRange();
  function textWidth(el){
    rng.selectNodeContents(el);
    return rng.getBoundingClientRect().width;
  }
  function fitHero(){
    var avail = heroEl.clientWidth - 18;
    if(avail <= 0) return;
    megaLines.forEach(function(el){
      el.style.fontSize = "";
      var size = parseFloat(getComputedStyle(el).fontSize);
      var w = textWidth(el);
      if(w <= avail) return;
      size = size * avail / w;
      el.style.fontSize = size.toFixed(2) + "px";
      var w2 = textWidth(el);            /* second pass — kerning is not linear */
      if(w2 > avail) el.style.fontSize = (size * avail / w2).toFixed(2) + "px";
    });
  }
  safe(fitHero);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ safe(fitHero); });
  var fitTimer;
  window.addEventListener("resize", function(){
    clearTimeout(fitTimer); fitTimer = setTimeout(function(){ safe(fitHero); }, 120);
  });

  /* ---------------- petals ---------------- */
  var cv = document.getElementById("petal-canvas"), ctx = cv.getContext("2d");
  var petals = [], W=0, H=0, dpr = Math.min(window.devicePixelRatio||1, 2);
  function resize(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  safe(resize);
  window.addEventListener("resize", function(){ safe(resize); });

  function Petal(mode){
    this.mode = mode || "fall";
    if(this.mode === "ring"){
      var a = Math.random()*Math.PI*2, sp = 5 + Math.random()*9;
      this.x = W/2; this.y = H*0.42;
      this.vx = Math.cos(a)*sp; this.vy = Math.sin(a)*sp - 2;
    }else if(this.mode === "burst"){
      this.x = Math.random()*W; this.y = H*0.55 + Math.random()*60;
      this.vx = (Math.random()-0.5)*5; this.vy = -(4+Math.random()*6);
    }else{
      this.x = Math.random()*W; this.y = -20 - Math.random()*H*0.4;
      this.vx = (Math.random()-0.5)*1.1; this.vy = 0.5 + Math.random()*1.2;
    }
    this.r = 4 + Math.random()*6;
    this.a = Math.random()*Math.PI*2;
    this.va = (Math.random()-0.5)*0.1;
    this.c = PETAL[(Math.random()*PETAL.length)|0];
    this.life = 1;
  }
  Petal.prototype.step = function(){
    this.x += this.vx; this.y += this.vy; this.a += this.va;
    if(this.mode === "fall"){
      this.vx += Math.sin(this.y*0.012)*0.02;
      if(this.y > H+30){ this.y = -20; this.x = Math.random()*W; }
    }else{
      this.vy += 0.16; this.vx *= 0.994; this.life -= 0.006;
    }
  };
  Petal.prototype.dead = function(){
    return this.mode !== "fall" && (this.life <= 0 || this.y > H+40);
  };
  Petal.prototype.draw = function(){
    ctx.save();
    ctx.translate(this.x,this.y); ctx.rotate(this.a);
    ctx.globalAlpha = Math.max(0, Math.min(1, this.life)) * 0.9;
    ctx.fillStyle = this.c;
    ctx.beginPath(); ctx.ellipse(0,0,this.r*0.6,this.r,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  };
  if(!reduced) safe(function(){
    for(var i=0;i<18;i++) petals.push(new Petal("fall"));
    (function loop(){
      ctx.clearRect(0,0,W,H);
      for(var i=petals.length-1;i>=0;i--){
        var p = petals[i]; p.step(); p.draw();
        if(p.dead()) petals.splice(i,1);
      }
      requestAnimationFrame(loop);
    })();
  });
  function spawn(mode, n){ if(!reduced) safe(function(){ for(var i=0;i<n;i++) petals.push(new Petal(mode)); }); }

  /* ---------------- screen router ---------------- */
  var busy = false;
  function goTo(id, silent){
    if(busy) return;
    var cur = document.querySelector(".screen.active");
    if(!cur || cur.id === id) return;
    busy = true;
    if(!silent && !reduced) cur.classList.add("leaving");
    setTimeout(function(){
      cur.classList.remove("active","leaving");
      document.getElementById(id).classList.add("active");
      busy = false;
    }, reduced ? 0 : (silent ? 0 : 550));
  }

  /* ---------------- the blow-cursor ---------------- */
  var blower = document.getElementById("blower");
  var hit = document.getElementById("cake-hit");
  if(fine && !reduced){
    hit.addEventListener("pointerenter", function(){ blower.classList.add("on"); });
    hit.addEventListener("pointerleave", function(){ blower.classList.remove("on"); });
    hit.addEventListener("pointermove", function(e){
      blower.style.left = e.clientX + "px";
      blower.style.top  = e.clientY + "px";
    });
  }

  /* ---------------- stage 1: one click blows everything ---------------- */
  var bloom  = document.getElementById("bloom"),
      candles = Array.prototype.slice.call(document.querySelectorAll(".candle"));
  var blown = false;

  function blowAll(){
    if(blown) return;
    blown = true;
    hit.classList.add("blown");

    if(fine && !reduced){
      blower.classList.remove("on");
      blower.classList.add("puff");
      setTimeout(function(){ blower.classList.remove("puff"); }, 600);
    }

    /* 1 — each flame bends away and snuffs out, one after another */
    candles.forEach(function(c,i){
      setTimeout(function(){ c.classList.add("out"); }, reduced ? 0 : i*190);
    });

    if(reduced){ setTimeout(function(){ goTo("s-hero", true); }, 300); return; }

    /* 2 — a beat of just smoke rising off the dark cake */
    setTimeout(function(){ spawn("burst", 30); }, 900);

    /* 3 — the smoke swells until it swallows the screen */
    setTimeout(function(){
      bloom.classList.remove("go"); void bloom.offsetWidth; bloom.classList.add("go");
    }, 1500);

    /* 4 — swap screens while hidden inside the smoke */
    setTimeout(function(){ goTo("s-hero", true); }, 1900);

    /* 5 — marigolds fly out of the clearing smoke as the letters land */
    setTimeout(function(){ spawn("ring", 70); }, 2150);
    setTimeout(function(){ spawn("burst", 60); }, 2650);
  }
  hit.addEventListener("click", blowAll);
  hit.addEventListener("pointerup", blowAll);
  hit.addEventListener("touchend", function(e){ e.preventDefault(); blowAll(); }, {passive:false});

  /* ---------------- countdown ---------------- */
  var elD=document.getElementById("cd-d"), elH=document.getElementById("cd-h"),
      elM=document.getElementById("cd-m"), elS=document.getElementById("cd-s");
  function pad(n){ return String(n).padStart(2,"0"); }
  function setSec(v){
    if(elS.textContent !== v && !reduced){
      elS.classList.remove("pop"); void elS.offsetWidth; elS.classList.add("pop");
    }
    elS.textContent = v;
  }
  function tick(){
    var now = new Date(), y = now.getFullYear();
    if(now.getMonth() === 7 && now.getDate() === 19){
      var left = new Date(y,7,20,0,0,0) - now;
      elD.textContent = "🎂";
      elH.textContent = pad(Math.floor(left/3.6e6));
      elM.textContent = pad(Math.floor(left/6e4)%60);
      setSec(pad(Math.floor(left/1000)%60));
      return;
    }
    var target = new Date(y,7,19,0,0,0);
    if(now > target) target = new Date(y+1,7,19,0,0,0);
    var d = target - now;
    elD.textContent = Math.floor(d/8.64e7);
    elH.textContent = pad(Math.floor(d/3.6e6)%24);
    elM.textContent = pad(Math.floor(d/6e4)%60);
    setSec(pad(Math.floor(d/1000)%60));
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- one click opens the gift ---------------- */
  var box  = document.getElementById("giftbox"),
      ring = document.getElementById("ring-fg"),
      tip  = document.getElementById("tip"),
      FILL = 1150;

  var opened = false;

  function openGift(e){
    if(opened) return;
    if(e){ e.preventDefault(); }
    opened = true;
    box.classList.add("filling");          /* the ring fills through CSS */
    tip.textContent = "khul raha hai… 🌼";

    setTimeout(function(){ spawn("burst", 8); }, 380);
    setTimeout(function(){ spawn("burst", 12); }, 760);

    setTimeout(function(){
      box.classList.remove("filling");
      box.classList.add("done");
      ring.style.strokeDashoffset = "0";
      tip.textContent = "khul gaya! 🎁";
      spawn("ring", 80);
      spawn("burst", 60);
      setTimeout(function(){ goTo("s-gift"); }, 480);
    }, FILL);
  }

  box.addEventListener("click", openGift);
  box.addEventListener("touchend", function(e){ e.preventDefault(); openGift(); }, {passive:false});

  /* ---------------- photos ----------------
     Photo add karne ke liye src mein data URI ya path daalo.
     src khaali = placeholder frame.
  ------------------------------------------- */
  var PHOTOS = [
    { src:"img/steps.jpg",  caption:"yeh wali sabse pyaari", fav:true },
    { src:"img/smile.jpg",  caption:"keep smiling like this always baba" },
    { src:"img/filter.jpg", caption:"filter ne bhi haar maan li" },
    { src:"img/pout.jpg",   caption:"'main theek hoon' wala face" },
    { src:"img/art.jpg",    caption:"Daku madam 😄" }
  ];
  (function(){
    var g = document.getElementById("gallery");
    PHOTOS.forEach(function(p, i){
      var fig = document.createElement("figure");
      fig.className = "polaroid" + (p.fav ? " fav" : "");
      fig.style.transform = "rotate(" + (p.fav ? 0 : (i % 2 ? 1.8 : -2.1)) + "deg)";
      if(p.src){
        var img = document.createElement("img");
        img.className = "polaroid-img"; img.src = p.src; img.alt = p.caption; img.loading = "lazy";
        fig.appendChild(img);
      }else{
        var ph = document.createElement("div");
        ph.className = "polaroid-empty"; ph.textContent = "photo aayegi yahan";
        fig.appendChild(ph);
      }
      var cap = document.createElement("figcaption");
      cap.className = "polaroid-cap"; cap.textContent = p.caption;
      fig.appendChild(cap);
      g.appendChild(fig);
    });
  })();

})();
</script>
